services:
  music-hardlink:
    image: hamily/music-hardlink:latest
    container_name: music-hardlink
    restart: unless-stopped
    ports:
      - "2691:2691"
    volumes:
      - ./data:/data                       # 数据目录（数据库/缓存/音源脚本）
      - /path/to/source:/source            # 源目录（下载目标，须读写；硬链接绝不修改文件内容）
      - /path/to/library:/library          # 媒体库目录（硬链接目标，须与源同文件系统）
    environment:
      - TZ=Asia/Shanghai
      # 可选：直接通过环境变量配置（也可在 Web 界面配置）
      - MUSIC_SOURCE_DIRS=/source
      - MUSIC_LIBRARY_DIR=/library
      - MUSIC_DATA_DIR=/data
      # 音源中转 API（搜索下载用，如 ikun 音源）
      - MUSIC_SCRAPE__API_URL=https://c.wwwweb.top
      - MUSIC_SCRAPE__API_KEY=IKM-P82900001-SrUuI7iVi5Kfayhz-Yb
      - MUSIC_SCRAPE__API_SOURCE=tx
      - MUSIC_SCRAPE__API_QUALITY=128k
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:2691/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

services:
  music-hardlink:
    image: hamily/music-hardlink:latest
    container_name: music-hardlink
    restart: unless-stopped
    ports:
      - "2691:2691"
    volumes:
      - /vol1/1000/docker/hardlink:/data
      - /vol2/1000/music/raw:/music
    environment:
      - TZ=Asia/Shanghai

# 启动后打开 http://192.168.31.3:2691 → 设置页填：
#   源目录 = /music        媒体库目录 = /music/link
#   中转音源 API（可选，官方直连失败才用）
# 配置保存在 /data/config.json，重建容器不丢。
# 不要加 MUSIC_ 开头的环境变量：优先级高于界面配置，会把界面改的值覆盖回去。
#
# 首次部署先验证硬链接（应输出「硬链接成功」）：
#   sudo mkdir -p /vol2/1000/music/raw/link
#   sudo ln "/vol2/1000/music/raw/<任一歌曲>" /vol2/1000/music/raw/link/_test \
#     && echo "硬链接成功" && sudo rm /vol2/1000/music/raw/link/_test
# 然后把旧媒体库迁移进来：
#   sudo cp -a /vol2/1000/music/link/. /vol2/1000/music/raw/link/
# 最后 Web 点「全量同步」，即为真正的零拷贝硬链接。
